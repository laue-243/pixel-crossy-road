<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Crossy Road</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let chicken = {x:180, y:520};
let lanes = [];
let score = 0;
let frame = 0;
let cameraY = 0;

function generateLane(y, type) {
  const lane = {y, type, objects: []};
  if (type === 'road') {
    for (let i=0; i<3; i++) {
      lane.objects.push({x: Math.random()*400, speed: 2+Math.random()*2, dir: Math.random()>0.5?1:-1, w:40});
    }
  } else if (type === 'river') {
    for (let i=0; i<2; i++) {
      lane.objects.push({x: Math.random()*400, speed: 1+Math.random(), w:60});
    }
  }
  return lane;
}

for (let i=0; i<20; i++) {
  const type = i % 4 === 0 ? 'grass' : i % 4 === 1 ? 'road' : i % 4 === 2 ? 'grass' : 'river';
  lanes.push(generateLane(600 - i*40, type));
}

function loop() {
  frame++;
  lanes.forEach(lane => {
    if (lane.type === 'road' || lane.type === 'river') {
      lane.objects.forEach(o => {
        o.x += o.speed * (o.dir || -1);
        if (o.x > 450) o.x = -50;
        if (o.x < -50) o.x = 450;
      });
    }
  });

  // Collision
  const currentLane = lanes.find(l => Math.abs(l.y - chicken.y) < 20);
  if (currentLane && currentLane.type === 'road') {
    currentLane.objects.forEach(o => {
      if (chicken.x < o.x + o.w && chicken.x + 30 > o.x) {
        alert('Hit by car! Score: '+score);
        location.reload();
      }
    });
  }
  if (currentLane && currentLane.type === 'river') {
    let onLog = false;
    currentLane.objects.forEach(o => {
      if (chicken.x > o.x && chicken.x < o.x + o.w) {
        onLog = true;
        chicken.x += o.speed * -1;
      }
    });
    if (!onLog) {
      alert('Drowned! Score: '+score);
      location.reload();
    }
  }

  if (chicken.y < cameraY + 100) {
    cameraY = chicken.y - 100;
    score = Math.max(score, Math.floor((520 - chicken.y) / 40));
  }

  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0,0,400,600);
  ctx.save();
  ctx.translate(0, -cameraY);
  lanes.forEach(lane => {
    if (lane.type === 'grass') ctx.fillStyle = '#0a0';
    else if (lane.type === 'road') ctx.fillStyle = '#333';
    else ctx.fillStyle = '#00f';
    ctx.fillRect(0, lane.y, 400, 40);
    if (lane.type === 'road') {
      ctx.fillStyle = '#f00';
      lane.objects.forEach(o => ctx.fillRect(o.x, lane.y+5, o.w, 25));
    } else if (lane.type === 'river') {
      ctx.fillStyle = '#8B4513';
      lane.objects.forEach(o => ctx.fillRect(o.x, lane.y+5, o.w, 25));
    }
  });
  ctx.fillStyle = '#ff0';
  ctx.fillRect(chicken.x, chicken.y, 30, 30);
  ctx.restore();
  ctx.fillStyle = '#000';
  ctx.font = '20px monospace';
  ctx.fillText('Score: '+score, 10, 30);
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') chicken.y -= 40;
  if (e.key === 'ArrowDown') chicken.y += 40;
  if (e.key === 'ArrowLeft') chicken.x = Math.max(0, chicken.x - 40);
  if (e.key === 'ArrowRight') chicken.x = Math.min(370, chicken.x + 40);
});

loop();
</script>
</body>
</html>
